name: validate

on:
  push:
    # A TAG push must not start this workflow. `release.yml` calls it through
    # `workflow_call`, and both runs land in the same concurrency group
    # (`validate-${{ github.ref }}`) — so the push-triggered one cancels the
    # release's own call, `release` and `publish` are SKIPPED for a `needs:` that
    # was cancelled rather than failed, and the tag ships nothing while the run
    # list shows a green validate beside it. Measured 2026-08-20 on
    # `agent-stack v0.13.0`: validate green, release cancelled at 2s, npm still
    # serving the previous version. It is a race, which is why the two siblings
    # with the same shape happened to publish.
    tags-ignore: ['**']
  pull_request:
  # Callable, so `release.yml` can gate a publish on THIS suite instead of a copy of
  # it. The negatives live here as steps; running them from the release workflow any
  # other way would mean a second home for every plant.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural validator
        run: python3 test/validate.py

      # The manual gate's own fixtures, both directions. They run the pure decision module
      # with no HOME and then the real hook as a process, because "fails silent" and
      # "exit 0" are properties of the script rather than of the module.
      - name: Manual-gate fixtures (refusals, false-positive plants, the hook as a process)
        run: node test/moneygate_test.js

      # The money fixtures: both assertion packs against their reference implementation,
      # both `--self-test` runs (every assertion watched failing, every rule isolated), and
      # three plants that neuter an assertion and require the self-test to notice.
      - name: Money fixtures (both packs, both modes, neutered-assertion plants)
        run: node test/fixtures_test.js

      # Both installers against throwaway HOMEs. The case this step exists for is
      # PLUGIN-PRESENT: a fake HOME whose installed_plugins.json declares the
      # sheleg-dev plugin, asserting the exit-3 refusal, the remedy in the output,
      # and that nothing was written. Every member's CI tested only a fresh HOME
      # until 2026-08-29, which is how the family's installers shipped a
      # shadow-writer nobody had ever run against a plugin (telegram-dev,
      # reproduced live that day). The `Installers run` step below keeps the
      # fresh-HOME sweep; the cases live in test/installer_test.js so `npm test`
      # locally and this job exercise the same assertions.
      - name: Installer functional tests (fresh / rerun-skip / --force / plugin-present refusal)
        run: node test/installer_test.js

      # Every negative self-test below plants a defect and REQUIRES a failure.
      # A validator nobody has watched fail is not evidence that it works.

      - name: Negative self-test (a release that does not gate on validate must fail)
        run: |
          set -eu
          rm -rf /tmp/nogate-rel && cp -R . /tmp/nogate-rel
          python3 - <<'PY'
          # On 2026-08-12 this repository tagged v0.4.1 while its own validate run for that
          # tag FAILED, and npm served 0.4.1 four minutes later. Two separate workflows,
          # nothing connecting them. The `workflow_call` connects them; this proves the
          # connection is checked, because a dependency nobody checks is one somebody
          # removes.
          p = "/tmp/nogate-rel/.github/workflows/release.yml"
          s = open(p, encoding="utf-8").read()
          old = "    needs: validate\n"
          assert old in s, "PLANT DID NOT LAND: release.yml no longer declares needs: validate"
          open(p, "w", encoding="utf-8").write(s.replace(old, "", 1))
          PY
          if python3 /tmp/nogate-rel/test/validate.py; then
            echo "ERROR: validator accepted a release that runs beside validate instead of after it"
            exit 1
          else
            echo "OK: validator refuses a release that could publish over a red suite"
          fi

      - name: Negative self-test (version drift must fail)
        run: |
          set -eu
          cp -R . /tmp/drift-copy
          python3 - <<'PY'
          # Python, never `sed -i`: BSD sed needs an argument to -i, so every sed plant
          # in this file was a no-op on macOS and could only ever be exercised in CI —
          # which is how a broken one went unnoticed for two days. And it asserts it
          # changed something, so a plant that stops landing says so instead of blaming
          # the guard it can no longer disarm.
          import json, re
          p = "/tmp/drift-copy/plugins/sheleg-dev/.claude-plugin/plugin.json"
          s = open(p, encoding="utf-8").read()
          s2 = re.sub(r'"version":\s*"[0-9][0-9.]*"', '"version": "0.0.0-corrupt"', s, count=1)
          assert s2 != s, "PLANT DID NOT LAND: no version field in this plugin.json"
          open(p, "w", encoding="utf-8").write(s2)
          assert json.load(open(p))["version"] == "0.0.0-corrupt", "PLANT DID NOT LAND"
          PY
          if python3 /tmp/drift-copy/test/validate.py; then
            echo "ERROR: validator passed on a corrupted copy — it cannot fail"
            exit 1
          else
            echo "OK: validator FAILs on version drift"
          fi

      - name: Negative self-test (over-long description must fail)
        run: |
          set -eu
          cp -R . /tmp/desc-copy
          python3 - <<'PY'
          import re
          p = "/tmp/desc-copy/plugins/sheleg-dev/skills/crypto-payments/SKILL.md"
          s = open(p, encoding="utf-8").read()
          # Anchored on the folded block's SHAPE, not on any wording. The previous
          # version replaced the literal '"BTCPay".', which the description stopped
          # containing: the plant silently planted nothing, the validator honestly
          # passed, and this step blamed a healthy guard — red main from 2026-08-12
          # to 2026-08-13. Standing instruction #6 in the umbrella's retro.
          m = re.search(r"^description: >-\n((?:  .*\n)+)", s, re.M)
          assert m, "PLANT DID NOT LAND: no folded description block in this SKILL.md"
          s2 = s[:m.end(1)] + "  " + ("padding " * 40).strip() + "\n" + s[m.end(1):]
          assert s2 != s, "PLANT DID NOT LAND: the description block was not extended"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/desc-copy/test/validate.py; then
            echo "ERROR: validator accepted a description past the 1024-char limit"
            exit 1
          else
            echo "OK: validator catches front matter the host would truncate silently"
          fi

      - name: Negative self-test (front-matter name must match the directory)
        run: |
          set -eu
          cp -R . /tmp/name-copy
          python3 - <<'PY'
          import re
          p = "/tmp/name-copy/plugins/sheleg-dev/skills/google-signin/SKILL.md"
          s = open(p, encoding="utf-8").read()
          # the front-matter KEY is the shape; the value is free to change
          s2, n = re.subn(r"^name: google-signin$", "name: google-signin-gis", s, count=1, flags=re.M)
          assert n == 1, "PLANT DID NOT LAND: no `name: google-signin` line in this SKILL.md"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/name-copy/test/validate.py; then
            echo "ERROR: validator accepted a skill whose name != its directory"
            exit 1
          else
            echo "OK: validator catches the rename that was missed on the way in"
          fi

      - name: Negative self-test (a trigger literal advertised by two skills must fail)
        run: |
          set -eu
          rm -rf /tmp/trig-copy && cp -R . /tmp/trig-copy
          python3 - <<'PY'
          # DEV-01, measured 2026-08-29: google-auth and google-signin both advertised
          # "google login", "GIS", "Sign In with Google" and the Russian sign-in phrase,
          # so a host matching either description fired on both. The fix stripped the
          # end-user set from google-auth; this plant puts two of them back and the
          # validator must refuse the collision rather than let the next edit re-ship it.
          p = "/tmp/trig-copy/plugins/sheleg-dev/skills/google-auth/SKILL.md"
          s = open(p, encoding="utf-8").read()
          old = 'Triggers - "google auth",'
          assert old in s, "PLANT DID NOT LAND: google-auth description changed shape"
          s2 = s.replace(old, 'Triggers - "google auth", "google login", "GIS",', 1)
          assert s2 != s, "PLANT DID NOT LAND: the collision was not planted"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/trig-copy/test/validate.py; then
            echo "ERROR: validator accepted a trigger literal advertised by two skills"
            exit 1
          else
            echo "OK: validator refuses a cross-skill trigger collision (DEV-01)"
          fi

      - name: Negative self-test (CONTRIBUTING routing to a file we do not have must fail)
        run: |
          set -eu
          # The B-47 row, restored verbatim: this table used to send benchmarks to a file
          # that lives in seo-aeo-audit and has never existed here.
          rm -rf /tmp/contrib && cp -R . /tmp/contrib
          python3 - <<'PY'
          p = "/tmp/contrib/CONTRIBUTING.md"
          t = open(p, encoding="utf-8").read()
          anchor = "| Anything user-visible |"
          assert anchor in t, "PLANT DID NOT LAND: no `Anything user-visible` row"
          row = "| A number, benchmark or dated figure | `benchmarks.md` |\n"
          open(p, "w", encoding="utf-8").write(t.replace(anchor, row + anchor, 1))
          PY
          if (cd /tmp/contrib && python3 test/validate.py); then
            echo "the validator accepted a table routing work to a file this repo has nowhere"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a shipped document naming a path we do not have must fail)
        run: |
          set -eu
          # The B-79 row, restored verbatim: SECURITY.md was a wholesale copy of
          # seo-aeo-audit's and named `scripts/page_audit.py`, a file this repository has
          # never had, in the npm-published document a reader consults precisely because
          # they will not read the code.
          rm -rf /tmp/deadpath && cp -R . /tmp/deadpath
          python3 - <<'PY'
          p = "/tmp/deadpath/SECURITY.md"
          t = open(p, encoding="utf-8").read()
          anchor = "## Credentials\n"
          assert anchor in t, "PLANT DID NOT LAND: no `## Credentials` heading in SECURITY.md"
          plant = "The auditor is `scripts/page_audit.py`.\n\n"
          open(p, "w", encoding="utf-8").write(t.replace(anchor, plant + anchor, 1))
          PY
          if (cd /tmp/deadpath && python3 test/validate.py); then
            echo "the validator accepted a shipped document naming a path this repo has nowhere"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a file:line citation past the end of the file must fail)
        run: |
          set -eu
          # The same defect one level down: an address that resolves to nothing. M-07 is
          # about a claim another actor can resolve, and `install.sh:9001` cannot be.
          rm -rf /tmp/deadline && cp -R . /tmp/deadline
          python3 - <<'PY'
          p = "/tmp/deadline/SECURITY.md"
          t = open(p, encoding="utf-8").read()
          old = "(`install.sh:62-63`)"
          assert old in t, "PLANT DID NOT LAND: SECURITY.md no longer cites install.sh:62-63"
          open(p, "w", encoding="utf-8").write(t.replace(old, "(`install.sh:9001`)", 1))
          PY
          if (cd /tmp/deadline && python3 test/validate.py); then
            echo "the validator accepted a citation pointing past the end of the file"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a stale FOREIGN_BY_DESIGN exemption must fail)
        run: |
          set -eu
          # An exemption list that keeps passing after the document stops naming the path
          # widens silently into a blanket, and the next copied paragraph walks through it.
          rm -rf /tmp/staleexempt && cp -R . /tmp/staleexempt
          python3 - <<'PY'
          p = "/tmp/staleexempt/CONTRIBUTING.md"
          t = open(p, encoding="utf-8").read()
          old = "`benchmarks.md`, `growth-plays.md`"
          assert old in t, "PLANT DID NOT LAND: CONTRIBUTING no longer signposts benchmarks.md"
          open(p, "w", encoding="utf-8").write(t.replace(old, "`growth-plays.md`", 1))
          PY
          if (cd /tmp/staleexempt && python3 test/validate.py); then
            echo "the validator accepted an exemption for a path no document names any more"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a live credential declared test must be refusable)
        run: |
          set -eu
          # SD-02 / M-06 direction 1. Heleket issues ONE key per merchant, it is also the
          # webhook signing secret, and "test mode" is a dashboard toggle over the same
          # key — so the only boundary available is a declared environment plus a boot
          # assertion that refuses a credential disagreeing with it. Delete the refusal
          # for the live-key-in-a-test-run direction and the gate must notice.
          rm -rf /tmp/credtest && cp -R . /tmp/credtest
          python3 - <<'PY'
          p = "/tmp/credtest/plugins/sheleg-dev/skills/crypto-payments/references/heleket-provider.md"
          t = open(p, encoding="utf-8").read()
          old = "HELEKET_ENV_TEST_HOLDS_LIVE_CREDENTIAL"
          assert old in t, "PLANT DID NOT LAND: the document no longer names " + old
          # renamed, not deleted: the document still discusses a boundary, and only the
          # refusable code is gone. That is what a rewrite quietly does.
          open(p, "w", encoding="utf-8").write(t.replace(old, "HELEKET_ENV_PROBABLY_FINE"))
          PY
          if (cd /tmp/credtest && python3 test/validate.py); then
            echo "the validator accepted a credential boundary that cannot refuse a live key in a test run"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a test credential declared live must be refusable)
        run: |
          set -eu
          # SD-02 / M-06 direction 2, and the one people skip. A production key on a dev
          # machine is the loud failure; a sandbox key in production is the quiet one —
          # invoices settle to a merchant nobody reconciles and nothing errors until the
          # revenue is missing. Half a boundary passes every test written for the other
          # half, which is why both directions are planted separately.
          rm -rf /tmp/credlive && cp -R . /tmp/credlive
          python3 - <<'PY'
          p = "/tmp/credlive/plugins/sheleg-dev/skills/crypto-payments/references/heleket-provider.md"
          t = open(p, encoding="utf-8").read()
          old = "HELEKET_ENV_LIVE_HOLDS_TEST_CREDENTIAL"
          assert old in t, "PLANT DID NOT LAND: the document no longer names " + old
          open(p, "w", encoding="utf-8").write(t.replace(old, "HELEKET_ENV_PROBABLY_FINE"))
          PY
          if (cd /tmp/credlive && python3 test/validate.py); then
            echo "the validator accepted a boundary that refuses only one direction"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (handing over a credential with no declared environment must fail)
        run: |
          set -eu
          # The measured defect itself, restored verbatim: `heleket-provider.md:1146` set
          # HELEKET_API_KEY in a copyable block with no environment beside it, while the
          # next paragraph told the reader to flip a merchant-account toggle. A dev run
          # held the production credential and the document never said so.
          rm -rf /tmp/credenv && cp -R . /tmp/credenv
          python3 - <<'PY'
          import re
          p = "/tmp/credenv/plugins/sheleg-dev/skills/crypto-payments/references/heleket-provider.md"
          t = open(p, encoding="utf-8").read()
          # drop the declaration out of the Option B block only, leaving the key
          old = "HELEKET_ENV=test\n"
          assert old in t, "PLANT DID NOT LAND: no `HELEKET_ENV=test` assignment in a fenced block"
          t2 = t.replace(old, "", 1)
          assert t2 != t, "PLANT DID NOT LAND"
          open(p, "w", encoding="utf-8").write(t2)
          PY
          if (cd /tmp/credenv && python3 test/validate.py); then
            echo "the validator accepted a block handing over a live credential with no declared environment"
            exit 1
          fi
          echo "rejected, as it must be"

      # ---- SD-03 / M-30: the manual gate. Eight plants, five against the validator that
      # requires the gate to exist in a working shape, three against the gate's own
      # decision module. The second group is the one that matters most: a guard whose
      # fixtures pass after its discriminator is removed is a guard nobody has watched.

      - name: Negative self-test (a gate that reports instead of preventing must fail)
        run: |
          set -eu
          # manifesto.md:200 — "a precondition is stronger than a warning." Moved to
          # PostToolUse this hook is a report about a refund that already cleared, which is
          # the whole defect SD-03 closed.
          rm -rf /tmp/gate-post && cp -R . /tmp/gate-post
          python3 - <<'PY'
          p = "/tmp/gate-post/plugins/sheleg-dev/hooks/hooks.json"
          t = open(p, encoding="utf-8").read()
          old = '"PreToolUse"'
          assert old in t, "PLANT DID NOT LAND: hooks.json no longer declares PreToolUse"
          open(p, "w", encoding="utf-8").write(t.replace(old, '"PostToolUse"', 1))
          PY
          if (cd /tmp/gate-post && python3 test/validate.py); then
            echo "the validator accepted a gate that can only report after the money moved"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (an `if` filter on the gate must fail)
        run: |
          set -eu
          # The Claude Code reference calls a hook entry's `if` best-effort and says it FAILS
          # OPEN on a command it cannot parse. `Bash(stripe refunds*)` is also exactly the
          # shape a `bash -c '…'` wrapper defeats, so the filter is a documented bypass
          # dressed as a narrowing.
          rm -rf /tmp/gate-if && cp -R . /tmp/gate-if
          python3 - <<'PY'
          p = "/tmp/gate-if/plugins/sheleg-dev/hooks/hooks.json"
          t = open(p, encoding="utf-8").read()
          old = '        "matcher": "Bash",\n'
          assert old in t, "PLANT DID NOT LAND: no Bash matcher in hooks.json"
          open(p, "w", encoding="utf-8").write(
              t.replace(old, old + '        "if": "Bash(stripe refunds*)",\n', 1))
          PY
          if (cd /tmp/gate-if && python3 test/validate.py); then
            echo "the validator accepted a gate resting on a filter that fails open"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a decision inlined into the hook must fail)
        run: |
          set -eu
          # "A guard decides in a pure module; the hook only moves bytes." A verdict computed
          # inside the hook cannot be fixtured without a live session, which is how a guard
          # ends up shipped with nobody having watched it refuse anything.
          rm -rf /tmp/gate-inline && cp -R . /tmp/gate-inline
          python3 - <<'PY'
          p = "/tmp/gate-inline/plugins/sheleg-dev/hooks/money-gate.js"
          t = open(p, encoding="utf-8").read()
          old = "'moneygate.js'"
          assert old in t, "PLANT DID NOT LAND: the hook no longer requires the pure module"
          open(p, "w", encoding="utf-8").write(t.replace(old, "'inlined-decision.js'", 1))
          PY
          if (cd /tmp/gate-inline && python3 test/validate.py); then
            echo "the validator accepted a hook that decides for itself"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a hook that stops failing silent must fail)
        run: |
          set -eu
          # A guard that throws breaks every turn in every session, including sessions of
          # packs that never asked for this one. That is a worse outcome than the defect the
          # guard exists to prevent, so the exit is checked rather than trusted.
          rm -rf /tmp/gate-throw && cp -R . /tmp/gate-throw
          python3 - <<'PY'
          p = "/tmp/gate-throw/plugins/sheleg-dev/hooks/money-gate.js"
          t = open(p, encoding="utf-8").read()
          old = "process.exit(0)"
          assert old in t, "PLANT DID NOT LAND: the hook no longer exits 0"
          open(p, "w", encoding="utf-8").write(t.replace(old, "process.exitCode = 2"))
          PY
          if (cd /tmp/gate-throw && python3 test/validate.py); then
            echo "the validator accepted a hook that can break every turn in every session"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (dropping the false-positive plants must fail)
        run: |
          set -eu
          # The audit rated a guard nobody has watched failing as no evidence. The converse
          # costs the same: a guard that refuses correct input gets switched off, and this
          # repository's own commands quote `sk_live_` and hand over a `.env` heredoc. So the
          # allow-plants are required to exist, not merely encouraged.
          rm -rf /tmp/gate-oneway && cp -R . /tmp/gate-oneway
          python3 - <<'PY'
          p = "/tmp/gate-oneway/test/moneygate_test.js"
          t = open(p, encoding="utf-8").read()
          assert t.count("\nallows(") > 4, "PLANT DID NOT LAND: no allow-plants to remove"
          open(p, "w", encoding="utf-8").write(t.replace("\nallows(", "\nvoid_allows(", 20))
          PY
          if (cd /tmp/gate-oneway && python3 test/validate.py); then
            echo "the validator accepted a one-directional fixture set"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a live-key rule narrowed to the bare prefix must fail)
        run: |
          set -eu
          # The shape is the discriminator, and it is what separates a credential from a
          # document quoting one. Narrow it to the prefix and `SECURITY.md`'s own sweep for
          # `sk_live_[A-Za-z0-9]` is refused — the pack can no longer run its own check.
          # This plant went UNCAUGHT on the first pass, because every prefix fixture was
          # being saved by the reader denylist instead. Two overlapping mechanisms, neither
          # individually proven, is the shape that produced it.
          rm -rf /tmp/gate-prefix && cp -R . /tmp/gate-prefix
          python3 - <<'PY'
          p = "/tmp/gate-prefix/plugins/sheleg-dev/hooks/lib/moneygate.js"
          t = open(p, encoding="utf-8").read()
          old = "const LIVE_KEY = /\\b(sk|rk)_live_[A-Za-z0-9]{16,}/;"
          assert old in t, "PLANT DID NOT LAND: LIVE_KEY no longer reads a key-shaped body"
          open(p, "w", encoding="utf-8").write(t.replace(old, "const LIVE_KEY = /\\b(sk|rk)_live_/;", 1))
          PY
          if node /tmp/gate-prefix/test/moneygate_test.js; then
            echo "the fixtures passed while the gate refuses this repository's own live-key sweep"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a heredoc body read as an invocation must fail)
        run: |
          set -eu
          # UM-10's lesson, and B-59's before it: a guard must read what would RUN. A `.env`
          # block fed to `cat` is data — `heleket-provider.md` hands the reader exactly that
          # — while a body fed to `bash` is a script and stays readable, because stripping
          # every heredoc would be a documented bypass.
          rm -rf /tmp/gate-heredoc && cp -R . /tmp/gate-heredoc
          python3 - <<'PY'
          p = "/tmp/gate-heredoc/plugins/sheleg-dev/hooks/lib/moneygate.js"
          t = open(p, encoding="utf-8").read()
          old = "      dropping = !HEREDOC_SHELLS.has(cmd);"
          assert old in t, "PLANT DID NOT LAND: the heredoc rule changed shape"
          open(p, "w", encoding="utf-8").write(t.replace(old, "      dropping = false;", 1))
          PY
          if node /tmp/gate-heredoc/test/moneygate_test.js; then
            echo "the fixtures passed while a documented .env heredoc is refused"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a test-declaring run that can be authorised must fail)
        run: |
          set -eu
          # SD-02's rule, one layer out: "Could not prove it was safe" must never read as
          # "it was safe". A run that declares test and then refunds a real card is
          # incoherent whichever half is true, so no variable may buy its way past that —
          # and an authorisation that CAN is the quiet version of having no gate.
          rm -rf /tmp/gate-authtest && cp -R . /tmp/gate-authtest
          python3 - <<'PY'
          p = "/tmp/gate-authtest/plugins/sheleg-dev/hooks/lib/moneygate.js"
          t = open(p, encoding="utf-8").read()
          old = "  if (runEnv === 'test') return false;"
          assert old in t, "PLANT DID NOT LAND: allowedFor no longer refuses a test-declaring run"
          open(p, "w", encoding="utf-8").write(t.replace(old, "  if (runEnv === 'never') return false;", 1))
          PY
          if node /tmp/gate-authtest/test/moneygate_test.js; then
            echo "the fixtures passed while a test-declaring run can be authorised for a live refund"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a claimed invariant whose fixture is gone must fail)
        run: |
          set -eu
          # SD-04, direction one. `references/webhook-events.md` states that
          # `amount_refunded` is cumulative and points at the pair that proves it. Delete a
          # fixture and the paragraph is back to being advice — which is the state the whole
          # row exists to end.
          rm -rf /tmp/fx-missing && cp -R . /tmp/fx-missing
          rm -f /tmp/fx-missing/plugins/sheleg-dev/skills/stripe-billing/fixtures/charge-refunded-remainder.json
          if (cd /tmp/fx-missing && python3 test/validate.py); then
            echo "the validator accepted a claimed invariant with no fixture"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a fixture nobody claims must fail)
        run: |
          set -eu
          # SD-04, direction two. An orphan fixture rots without ever going red, and this
          # one was not hypothetical: the guard's first run found
          # `checkout-session-completed-paid.json` claimed by nothing, which is why there is
          # now a `paid-session-grants-once` assertion using it.
          rm -rf /tmp/fx-orphan && cp -R . /tmp/fx-orphan
          cp /tmp/fx-orphan/plugins/sheleg-dev/skills/ad-tracking/fixtures/purchase-capi-server.json \
             /tmp/fx-orphan/plugins/sheleg-dev/skills/ad-tracking/fixtures/nobody-claims-me.json
          if (cd /tmp/fx-orphan && python3 test/validate.py); then
            echo "the validator accepted a fixture no invariant claims"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a dead fixture pointer in a reference must fail)
        run: |
          set -eu
          # B-79's defect one layer in, and the bounded widening B-82 asked for: the corpus
          # is the documents a manifest NAMES and the tokens are the ones under `fixtures/`,
          # so a reference naming the reader's own `src/lib/stripe.ts` is still none of its
          # business.
          rm -rf /tmp/fx-deadptr && cp -R . /tmp/fx-deadptr
          python3 - <<'PY'
          p = "/tmp/fx-deadptr/plugins/sheleg-dev/skills/stripe-billing/references/webhook-events.md"
          t = open(p, encoding="utf-8").read()
          old = "fixtures/charge-refunded-partial.json"
          assert old in t, "PLANT DID NOT LAND: the refund pointer moved"
          open(p, "w", encoding="utf-8").write(t.replace(old, "fixtures/charge-refunded-renamed.json", 1))
          PY
          if (cd /tmp/fx-deadptr && python3 test/validate.py); then
            echo "the validator accepted a reference pointing at a fixture that is not there"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a reworded claim that leaves its fixture behind must fail)
        run: |
          set -eu
          # The MANUAL_GATE_PROSE shape, one row over: a rule whose wording moves while the
          # fixture stays is how a suite ends up proving something the document no longer
          # says. The phrase is recorded in the manifest, which ships to the reader.
          rm -rf /tmp/fx-reworded && cp -R . /tmp/fx-reworded
          python3 - <<'PY'
          p = "/tmp/fx-reworded/plugins/sheleg-dev/skills/stripe-billing/references/webhook-events.md"
          t = open(p, encoding="utf-8").read()
          old = "**Never derive state from arrival order.**"
          assert old in t, "PLANT DID NOT LAND: the ordering rule moved"
          open(p, "w", encoding="utf-8").write(t.replace(old, "**Do not trust the order events arrive in.**", 1))
          PY
          if (cd /tmp/fx-reworded && python3 test/validate.py); then
            echo "the validator accepted a claim reworded away from the fixture that proves it"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (an assertion that can no longer fail must fail the suite)
        run: |
          set -eu
          # The one that matters most, and the reason `test/fixtures_test.js` exists beside
          # the structural guard: every path above can be green while the assertions
          # discriminate nothing. Neuter one and the pack's own `--self-test` must notice.
          rm -rf /tmp/fx-neutered && cp -R . /tmp/fx-neutered
          python3 - <<'PY'
          p = ("/tmp/fx-neutered/plugins/sheleg-dev/skills/ad-tracking/fixtures/"
               "assert-dedup-contract.mjs")
          t = open(p, encoding="utf-8").read()
          old = "      assert.equal(serverId, pixelId,"
          assert old in t, "PLANT DID NOT LAND: the shared-id assertion moved"
          open(p, "w", encoding="utf-8").write(t.replace(old, "      assert.equal(serverId, serverId,", 1))
          PY
          if node /tmp/fx-neutered/test/fixtures_test.js; then
            echo "the suite passed while an assertion could no longer fail"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a reference nobody links must fail)
        run: |
          set -eu
          cp -R . /tmp/orphan-copy
          touch /tmp/orphan-copy/plugins/sheleg-dev/skills/ad-tracking/references/nobody-loads-me.md
          if python3 /tmp/orphan-copy/test/validate.py; then
            echo "ERROR: validator accepted an unreferenced reference file"
            exit 1
          else
            echo "OK: validator rejects a reference nothing loads"
          fi

      - name: Negative self-test (a dangling reference link must fail)
        run: |
          set -eu
          cp -R . /tmp/dangling-copy
          rm -f /tmp/dangling-copy/plugins/sheleg-dev/skills/google-auth/references/workload-identity.md
          if python3 /tmp/dangling-copy/test/validate.py; then
            echo "ERROR: validator passed with a linked reference missing"
            exit 1
          else
            echo "OK: validator requires linked references to resolve"
          fi

      - name: Negative self-test (stray SKILL.md must fail)
        run: |
          set -eu
          cp -R . /tmp/stray-copy
          cp /tmp/stray-copy/plugins/sheleg-dev/skills/crypto-payments/SKILL.md \
             /tmp/stray-copy/plugins/sheleg-dev/SKILL.md
          if python3 /tmp/stray-copy/test/validate.py; then
            echo "ERROR: validator passed with a stray SKILL.md outside plugins/*/skills/*/"
            exit 1
          else
            echo "OK: validator rejects a stray SKILL.md"
          fi

      - name: Negative self-test (dropping the validator from CI must fail)
        run: |
          set -eu
          cp -R . /tmp/nogate-copy
          python3 - <<'PY'
          p = "/tmp/nogate-copy/.github/workflows/validate.yml"
          s = open(p, encoding="utf-8").read()
          old = "python3 test/validate.py"
          assert old in s, "PLANT DID NOT LAND: CI no longer calls the validator by this name"
          s2 = s.replace(old, "echo skipped")
          assert s2 != s, "PLANT DID NOT LAND"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/nogate-copy/test/validate.py; then
            echo "ERROR: validator passed while CI no longer calls it"
            exit 1
          else
            echo "OK: the gate notices when it stops being a gate"
          fi

      # ------------------------------------------------------------------ 2026-08-20
      # Thirteen more, one per guard added the day the check count turned out to be
      # `10 + len(skill_dirs)` -- a number that moved when a skill was added and stood
      # still when a check was, quoted in four ledger rows as evidence that a guard had
      # been added.

      - name: Negative self-test (a check count that does not count the checks must fail)
        run: |
          set -eu
          rm -rf /tmp/countderive && cp -R . /tmp/countderive
          python3 - <<'PY'
          p = "/tmp/countderive/test/validate.py"
          s = open(p, encoding="utf-8").read()
          old = "@check\ndef check_routed_triggers_still_advertised():"
          assert old in s, "PLANT DID NOT LAND: the last registered check moved"
          s = s.replace(old, "@check\ndef check_planted_extra():\n    pass\n\n\n" + old, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          if python3 /tmp/countderive/test/validate.py; then
            echo "ERROR: registering a check did not move the number the ledger quotes"
            exit 1
          else
            echo "OK: the verdict counts the registry, so a new check is visible"
          fi

      - name: Negative self-test (a SKILL.md body past the house working limit must fail)
        run: |
          set -eu
          rm -rf /tmp/bodybudget && cp -R . /tmp/bodybudget
          python3 - <<'PY'
          p = "/tmp/bodybudget/plugins/sheleg-dev/skills/crypto-payments/SKILL.md"
          s = open(p, encoding="utf-8").read()
          pad = ("\nA planted paragraph, here only to push this body past the working "
                 "limit so the gate can be watched refusing it. It says nothing and it "
                 "costs the same as a paragraph that does.\n") * 12
          open(p, "w", encoding="utf-8").write(s + pad)
          PY
          if python3 /tmp/bodybudget/test/validate.py; then
            echo "ERROR: validator accepted a body past the 4750 working limit"
            exit 1
          else
            echo "OK: the body budget is measured here, not in another repository"
          fi

      - name: Negative self-test (a ledger heading naming a version nobody ships must fail)
        run: |
          set -eu
          rm -rf /tmp/ledgerver && cp -R . /tmp/ledgerver
          python3 - <<'PY'
          import re
          p = "/tmp/ledgerver/docs/evidence/verification.md"
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn(r"^## Shipped state — v\S+$", "## Shipped state — v0.0.1", s,
                          count=1, flags=re.M)
          assert n == 1, "PLANT DID NOT LAND: no shipped-state heading"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/ledgerver/test/validate.py; then
            echo "ERROR: the ledger may describe an artifact nobody ships"
            exit 1
          else
            echo "OK: the shipped heading has to name what shipped"
          fi

      - name: Negative self-test (a ledger quoting a verdict the validator does not print must fail)
        run: |
          set -eu
          rm -rf /tmp/ledgerverdict && cp -R . /tmp/ledgerverdict
          python3 - <<'PY'
          import re
          p = "/tmp/ledgerverdict/docs/evidence/verification.md"
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn(r"`OK: sheleg-dev structurally valid \((\d+) checks",
                          "`OK: sheleg-dev structurally valid (99 checks", s, count=1)
          assert n == 1, "PLANT DID NOT LAND: no quoted verdict in the ledger"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/ledgerverdict/test/validate.py; then
            echo "ERROR: REQ-001 may quote a verdict nothing prints"
            exit 1
          else
            echo "OK: the quoted verdict is the printed verdict"
          fi

      - name: Negative self-test (a counted number in SECURITY.md that nothing recomputes must fail)
        run: |
          set -eu
          rm -rf /tmp/seccount && cp -R . /tmp/seccount
          python3 - <<'PY'
          import re
          p = "/tmp/seccount/SECURITY.md"
          s = open(p, encoding="utf-8").read()
          # Derive the number rather than hardcode it: this plant used to carry a
          # literal count, so adding one file to the repository broke the test that
          # exists to catch exactly that class of drift.
          m = re.search(r"# The shipped payload: (\d+) files\.", s)
          assert m, "PLANT DID NOT LAND: the payload count sentence moved"
          old, n = m.group(0), int(m.group(1))
          open(p, "w", encoding="utf-8").write(s.replace(old, f"# The shipped payload: {n - 1} files."))
          PY
          if python3 /tmp/seccount/test/validate.py; then
            echo "ERROR: SECURITY.md may state a count nobody recomputes (B-93)"
            exit 1
          else
            echo "OK: every counted number in SECURITY.md is recomputed here"
          fi

      - name: Negative self-test (a stale body-budget number in the evals record must fail)
        run: |
          set -eu
          rm -rf /tmp/evalnum && cp -R . /tmp/evalnum
          python3 - <<'PY'
          import re
          p = "/tmp/evalnum/docs/evals/stripe-billing.md"
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn(r"~\d+ tokens by the house heuristic",
                          "~4994 tokens by the house heuristic", s, count=1)
          assert n == 1, "PLANT DID NOT LAND: the token sentence moved"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/evalnum/test/validate.py; then
            echo "ERROR: the evals record may restate a body-budget number"
            exit 1
          else
            echo "OK: the evals numbers are recomputed from the skill"
          fi

      - name: Negative self-test (a coordination config pointing at a missing file must fail)
        run: |
          set -eu
          rm -rf /tmp/syncpath && cp -R . /tmp/syncpath
          python3 - <<'PY'
          import json
          p = "/tmp/syncpath/.claude/agent-sync.json"
          cfg = json.load(open(p, encoding="utf-8"))
          assert cfg["mergeLog"]["file"], "PLANT DID NOT LAND: no mergeLog.file"
          cfg["mergeLog"]["file"] = "docs/NOPE.md"
          open(p, "w", encoding="utf-8").write(json.dumps(cfg, indent=2) + "\n")
          PY
          if python3 /tmp/syncpath/test/validate.py; then
            echo "ERROR: the coordination config may point at a file nobody created"
            exit 1
          else
            echo "OK: every path in .claude/agent-sync.json resolves"
          fi

      - name: Negative self-test (guardedFiles claiming the ledger and not the board must fail)
        run: |
          set -eu
          rm -rf /tmp/syncguard && cp -R . /tmp/syncguard
          python3 - <<'PY'
          import json
          p = "/tmp/syncguard/.claude/agent-sync.json"
          cfg = json.load(open(p, encoding="utf-8"))
          before = len(cfg["guardedFiles"])
          cfg["guardedFiles"] = [f for f in cfg["guardedFiles"]
                                 if f != "docs/evidence/backlog.md"]
          assert len(cfg["guardedFiles"]) == before - 1, "PLANT DID NOT LAND"
          open(p, "w", encoding="utf-8").write(json.dumps(cfg, indent=2) + "\n")
          PY
          if python3 /tmp/syncguard/test/validate.py; then
            echo "ERROR: the board may be edited unclaimed while the ledger is claimed"
            exit 1
          else
            echo "OK: both evidence documents are guarded"
          fi

      - name: Negative self-test (a gate line naming fewer suites than npm test runs must fail)
        run: |
          set -eu
          rm -rf /tmp/gateline && cp -R . /tmp/gateline
          python3 - <<'PY'
          p = "/tmp/gateline/CONTRIBUTING.md"
          s = open(p, encoding="utf-8").read()
          old = "                  # then node test/fixtures_test.js"
          assert old in s, "PLANT DID NOT LAND: the gate line moved"
          open(p, "w", encoding="utf-8").write(s.replace(old, "                  #"))
          PY
          if python3 /tmp/gateline/test/validate.py; then
            echo "ERROR: a document may describe two thirds of the gate as the gate"
            exit 1
          else
            echo "OK: the gate line is derived from package.json -> scripts.test"
          fi

      - name: Negative self-test (an install channel that hides the missing gate must fail)
        run: |
          set -eu
          rm -rf /tmp/installnotice && cp -R . /tmp/installnotice
          python3 - <<'PY'
          p = "/tmp/installnotice/install.sh"
          s = open(p, encoding="utf-8").read()
          assert "manual gate" in s, "PLANT DID NOT LAND: install.sh says nothing about the gate"
          open(p, "w", encoding="utf-8").write(s.replace("manual gate", "installer"))
          PY
          if python3 /tmp/installnotice/test/validate.py; then
            echo "ERROR: the destructive copy channel may ship without naming the gate"
            exit 1
          else
            echo "OK: both install channels say the gate does not travel with them"
          fi

      - name: Negative self-test (an unclassified document under docs/ must fail)
        run: |
          set -eu
          rm -rf /tmp/docsclass && cp -R . /tmp/docsclass
          printf '# Planted\n\nNames `scripts/nope.py`, which is nowhere.\n' \
            > /tmp/docsclass/docs/PLANTED.md
          if python3 /tmp/docsclass/test/validate.py; then
            echo "ERROR: a document under docs/ may arrive outside the corpus"
            exit 1
          else
            echo "OK: every document under docs/ is checked or declared a dated record"
          fi

      - name: Negative self-test (a shipped document naming a clone-only path must fail)
        run: |
          set -eu
          rm -rf /tmp/tarpath && cp -R . /tmp/tarpath
          python3 - <<'PY'
          p = "/tmp/tarpath/SECURITY.md"
          s = open(p, encoding="utf-8").read()
          anchor = "## Reporting a problem"
          assert anchor in s, "PLANT DID NOT LAND"
          s = s.replace(anchor, "See `docs/evidence/backlog.md` for the open list.\n\n"
                        + anchor, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          if python3 /tmp/tarpath/test/validate.py; then
            echo "ERROR: a document that ships may point at a path the tarball lacks"
            exit 1
          else
            echo "OK: a shipped document resolves against the tarball too"
          fi

      - name: Negative self-test (dropping the mcp__ half of the gate must fail)
        run: |
          set -eu
          rm -rf /tmp/mcpgate && cp -R . /tmp/mcpgate
          python3 - <<'PY'
          import json
          p = "/tmp/mcpgate/plugins/sheleg-dev/hooks/hooks.json"
          h = json.load(open(p, encoding="utf-8"))
          pre = h["hooks"]["PreToolUse"]
          before = len(pre)
          h["hooks"]["PreToolUse"] = [e for e in pre if "mcp__" not in (e.get("matcher") or "")]
          assert len(h["hooks"]["PreToolUse"]) == before - 1, "PLANT DID NOT LAND: no mcp matcher"
          open(p, "w", encoding="utf-8").write(json.dumps(h, indent=2) + "\n")
          PY
          if python3 /tmp/mcpgate/test/validate.py; then
            echo "ERROR: create_refund on an MCP server may bypass the gate unnoticed"
            exit 1
          else
            echo "OK: both doors of the gate are required"
          fi

      - name: Negative self-test (a copy-channel snippet weaker than the plugin must fail)
        run: |
          set -eu
          rm -rf /tmp/snippetgate && cp -R . /tmp/snippetgate
          python3 - <<'PY'
          import re
          p = "/tmp/snippetgate/README.md"
          s = open(p, encoding="utf-8").read()
          pat = r'\n    \{ "matcher": "mcp__\.\*",(?:.|\n)*?"timeout": 15 \} \] \}\n'
          s2, n = re.subn(pat, "\n", s, count=1)
          assert n == 1, "PLANT DID NOT LAND: the snippet's mcp entry moved"
          s2 = s2.replace('"timeout": 15 } ] },', '"timeout": 15 } ] }', 1)
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/snippetgate/test/validate.py; then
            echo "ERROR: the README may hand a copy-channel reader a weaker gate"
            exit 1
          else
            echo "OK: the snippet is compared against the plugin manifest"
          fi

      - name: install.sh syntax check
        run: bash -n install.sh

      - name: Installers run — every skill, fresh / rerun-skip / --force / bad arg
        run: |
          set -eu
          export HOME=/tmp/fakehome
          mkdir -p "$HOME"
          # Derive the roster from the repository. This step used to name six skills
          # and assert the number four times; adding a seventh broke it, which is the
          # second release this file has failed for carrying a hand-written count
          # (v0.8.0 died here too, on a different literal). A count that is computed
          # cannot go stale.
          SKILLS=$(ls -1 plugins/sheleg-dev/skills)
          N=$(printf '%s\n' "$SKILLS" | wc -l | tr -d ' ')
          echo "roster: $N skills — $(printf '%s ' $SKILLS)"
          node bin/sheleg-dev.js
          for s in $SKILLS; do
            test -f "$HOME/.claude/skills/$s/SKILL.md" || { echo "missing $s"; exit 1; }
          done
          test -f "$HOME/.claude/skills/crypto-payments/references/heleket-provider.md"
          test -f "$HOME/.claude/skills/google-auth/references/workload-identity.md"
          test -f "$HOME/.claude/skills/stripe-billing/references/webhook-events.md"
          test "$(node bin/sheleg-dev.js | grep -c '^skip:')" = "$N"
          test "$(node bin/sheleg-dev.js --force | grep -c '^Installed')" = "$N"
          if node bin/sheleg-dev.js --wat; then
            echo "ERROR: unknown arg accepted"; exit 1
          fi
          rm -rf "$HOME/.claude"
          # Read the whole output, not the last line. `tail -1` asserted a POSITION, and
          # the release of v0.8.0 failed on it: the notice this script gained — that the
          # manual gate does not travel with a skills copy — prints after the summary, so
          # the summary stopped being last. The assertion was about the summary existing;
          # it is written that way now, and the notice has its own assertion so the new
          # behaviour is covered rather than merely tolerated.
          out=$(bash install.sh)
          printf '%s\n' "$out" | grep -q "Installed $N skill" \
            || { echo "install.sh did not report $N skills"; printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out" | grep -qi 'manual gate' \
            || { echo "install.sh stopped warning that the gate does not travel"; exit 1; }
          echo "OK: both installers behave, and the destructive one says what it cannot carry"

      - name: Workflow YAML parses
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/validate.yml')); print('workflow parses OK')"

      - name: Official Claude Code conformance (plugin + marketplace, strict)
        run: |
          set -eu
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/sheleg-dev --strict

  skill-audit:
    name: House skill audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the pinned family auditor
        uses: actions/checkout@v4
        with:
          repository: ssheleg/make-skill
          ref: 991cbb415be3e856f05c974e631423df552883e3
          path: .skill-auditor
          persist-credentials: false

      - name: Audit every shipped Agent Skill
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          auditor = Path(".skill-auditor/plugins/make-skill/skills/make-skill/scripts/audit_skill.py")
          skills = sorted({
              *Path(".").glob("plugins/*/skills/*/SKILL.md"),
              *Path(".").glob("skills/*/SKILL.md"),
          })
          if not skills:
              raise SystemExit("no shipped SKILL.md found")
          for manifest in skills:
              subprocess.run(
                  [sys.executable, str(auditor), "--house", str(manifest.parent)],
                  check=True,
              )
          print(f"OK: {len(skills)} shipped skill(s) passed the pinned house audit")
          PY

      - name: Validate behavioral eval data and watch the guard fail
        run: |
          python3 test/evals_validate.py
          python3 test/evals_validate.py --self-test

      - name: Validate the committed social preview
        run: python3 test/social_preview.py
