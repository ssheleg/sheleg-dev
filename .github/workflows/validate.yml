name: validate

on:
  push:
  pull_request:
  # Callable, so `release.yml` can gate a publish on THIS suite instead of a copy of
  # it. The negatives live here as steps; running them from the release workflow any
  # other way would mean a second home for every plant.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural validator
        run: python3 test/validate.py

      # The manual gate's own fixtures, both directions. They run the pure decision module
      # with no HOME and then the real hook as a process, because "fails silent" and
      # "exit 0" are properties of the script rather than of the module.
      - name: Manual-gate fixtures (refusals, false-positive plants, the hook as a process)
        run: node test/moneygate_test.js

      # Every negative self-test below plants a defect and REQUIRES a failure.
      # A validator nobody has watched fail is not evidence that it works.

      - name: Negative self-test (a release that does not gate on validate must fail)
        run: |
          set -eu
          rm -rf /tmp/nogate-rel && cp -R . /tmp/nogate-rel
          python3 - <<'PY'
          # On 2026-08-12 this repository tagged v0.4.1 while its own validate run for that
          # tag FAILED, and npm served 0.4.1 four minutes later. Two separate workflows,
          # nothing connecting them. The `workflow_call` connects them; this proves the
          # connection is checked, because a dependency nobody checks is one somebody
          # removes.
          p = "/tmp/nogate-rel/.github/workflows/release.yml"
          s = open(p, encoding="utf-8").read()
          old = "    needs: validate\n"
          assert old in s, "PLANT DID NOT LAND: release.yml no longer declares needs: validate"
          open(p, "w", encoding="utf-8").write(s.replace(old, "", 1))
          PY
          if python3 /tmp/nogate-rel/test/validate.py; then
            echo "ERROR: validator accepted a release that runs beside validate instead of after it"
            exit 1
          else
            echo "OK: validator refuses a release that could publish over a red suite"
          fi

      - name: Negative self-test (version drift must fail)
        run: |
          set -eu
          cp -R . /tmp/drift-copy
          python3 - <<'PY'
          # Python, never `sed -i`: BSD sed needs an argument to -i, so every sed plant
          # in this file was a no-op on macOS and could only ever be exercised in CI —
          # which is how a broken one went unnoticed for two days. And it asserts it
          # changed something, so a plant that stops landing says so instead of blaming
          # the guard it can no longer disarm.
          import json, re
          p = "/tmp/drift-copy/plugins/sheleg-dev/.claude-plugin/plugin.json"
          s = open(p, encoding="utf-8").read()
          s2 = re.sub(r'"version":\s*"[0-9][0-9.]*"', '"version": "0.0.0-corrupt"', s, count=1)
          assert s2 != s, "PLANT DID NOT LAND: no version field in this plugin.json"
          open(p, "w", encoding="utf-8").write(s2)
          assert json.load(open(p))["version"] == "0.0.0-corrupt", "PLANT DID NOT LAND"
          PY
          if python3 /tmp/drift-copy/test/validate.py; then
            echo "ERROR: validator passed on a corrupted copy — it cannot fail"
            exit 1
          else
            echo "OK: validator FAILs on version drift"
          fi

      - name: Negative self-test (over-long description must fail)
        run: |
          set -eu
          cp -R . /tmp/desc-copy
          python3 - <<'PY'
          import re
          p = "/tmp/desc-copy/plugins/sheleg-dev/skills/crypto-payments/SKILL.md"
          s = open(p, encoding="utf-8").read()
          # Anchored on the folded block's SHAPE, not on any wording. The previous
          # version replaced the literal '"BTCPay".', which the description stopped
          # containing: the plant silently planted nothing, the validator honestly
          # passed, and this step blamed a healthy guard — red main from 2026-08-12
          # to 2026-08-13. Standing instruction #6 in the umbrella's retro.
          m = re.search(r"^description: >-\n((?:  .*\n)+)", s, re.M)
          assert m, "PLANT DID NOT LAND: no folded description block in this SKILL.md"
          s2 = s[:m.end(1)] + "  " + ("padding " * 40).strip() + "\n" + s[m.end(1):]
          assert s2 != s, "PLANT DID NOT LAND: the description block was not extended"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/desc-copy/test/validate.py; then
            echo "ERROR: validator accepted a description past the 1024-char limit"
            exit 1
          else
            echo "OK: validator catches front matter the host would truncate silently"
          fi

      - name: Negative self-test (front-matter name must match the directory)
        run: |
          set -eu
          cp -R . /tmp/name-copy
          python3 - <<'PY'
          import re
          p = "/tmp/name-copy/plugins/sheleg-dev/skills/google-signin/SKILL.md"
          s = open(p, encoding="utf-8").read()
          # the front-matter KEY is the shape; the value is free to change
          s2, n = re.subn(r"^name: google-signin$", "name: google-signin-gis", s, count=1, flags=re.M)
          assert n == 1, "PLANT DID NOT LAND: no `name: google-signin` line in this SKILL.md"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/name-copy/test/validate.py; then
            echo "ERROR: validator accepted a skill whose name != its directory"
            exit 1
          else
            echo "OK: validator catches the rename that was missed on the way in"
          fi

      - name: Negative self-test (CONTRIBUTING routing to a file we do not have must fail)
        run: |
          set -eu
          # The B-47 row, restored verbatim: this table used to send benchmarks to a file
          # that lives in seo-aeo-audit and has never existed here.
          rm -rf /tmp/contrib && cp -R . /tmp/contrib
          python3 - <<'PY'
          p = "/tmp/contrib/CONTRIBUTING.md"
          t = open(p, encoding="utf-8").read()
          anchor = "| Anything user-visible |"
          assert anchor in t, "PLANT DID NOT LAND: no `Anything user-visible` row"
          row = "| A number, benchmark or dated figure | `benchmarks.md` |\n"
          open(p, "w", encoding="utf-8").write(t.replace(anchor, row + anchor, 1))
          PY
          if (cd /tmp/contrib && python3 test/validate.py); then
            echo "the validator accepted a table routing work to a file this repo has nowhere"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a shipped document naming a path we do not have must fail)
        run: |
          set -eu
          # The B-79 row, restored verbatim: SECURITY.md was a wholesale copy of
          # seo-aeo-audit's and named `scripts/page_audit.py`, a file this repository has
          # never had, in the npm-published document a reader consults precisely because
          # they will not read the code.
          rm -rf /tmp/deadpath && cp -R . /tmp/deadpath
          python3 - <<'PY'
          p = "/tmp/deadpath/SECURITY.md"
          t = open(p, encoding="utf-8").read()
          anchor = "## Credentials\n"
          assert anchor in t, "PLANT DID NOT LAND: no `## Credentials` heading in SECURITY.md"
          plant = "The auditor is `scripts/page_audit.py`.\n\n"
          open(p, "w", encoding="utf-8").write(t.replace(anchor, plant + anchor, 1))
          PY
          if (cd /tmp/deadpath && python3 test/validate.py); then
            echo "the validator accepted a shipped document naming a path this repo has nowhere"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a file:line citation past the end of the file must fail)
        run: |
          set -eu
          # The same defect one level down: an address that resolves to nothing. M-07 is
          # about a claim another actor can resolve, and `install.sh:9001` cannot be.
          rm -rf /tmp/deadline && cp -R . /tmp/deadline
          python3 - <<'PY'
          p = "/tmp/deadline/SECURITY.md"
          t = open(p, encoding="utf-8").read()
          old = "(`install.sh:21-22`)"
          assert old in t, "PLANT DID NOT LAND: SECURITY.md no longer cites install.sh:21-22"
          open(p, "w", encoding="utf-8").write(t.replace(old, "(`install.sh:9001`)", 1))
          PY
          if (cd /tmp/deadline && python3 test/validate.py); then
            echo "the validator accepted a citation pointing past the end of the file"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a stale FOREIGN_BY_DESIGN exemption must fail)
        run: |
          set -eu
          # An exemption list that keeps passing after the document stops naming the path
          # widens silently into a blanket, and the next copied paragraph walks through it.
          rm -rf /tmp/staleexempt && cp -R . /tmp/staleexempt
          python3 - <<'PY'
          p = "/tmp/staleexempt/CONTRIBUTING.md"
          t = open(p, encoding="utf-8").read()
          old = "`benchmarks.md`, `growth-plays.md`"
          assert old in t, "PLANT DID NOT LAND: CONTRIBUTING no longer signposts benchmarks.md"
          open(p, "w", encoding="utf-8").write(t.replace(old, "`growth-plays.md`", 1))
          PY
          if (cd /tmp/staleexempt && python3 test/validate.py); then
            echo "the validator accepted an exemption for a path no document names any more"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a live credential declared test must be refusable)
        run: |
          set -eu
          # SD-02 / M-06 direction 1. Heleket issues ONE key per merchant, it is also the
          # webhook signing secret, and "test mode" is a dashboard toggle over the same
          # key — so the only boundary available is a declared environment plus a boot
          # assertion that refuses a credential disagreeing with it. Delete the refusal
          # for the live-key-in-a-test-run direction and the gate must notice.
          rm -rf /tmp/credtest && cp -R . /tmp/credtest
          python3 - <<'PY'
          p = "/tmp/credtest/plugins/sheleg-dev/skills/crypto-payments/references/heleket-provider.md"
          t = open(p, encoding="utf-8").read()
          old = "HELEKET_ENV_TEST_HOLDS_LIVE_CREDENTIAL"
          assert old in t, "PLANT DID NOT LAND: the document no longer names " + old
          # renamed, not deleted: the document still discusses a boundary, and only the
          # refusable code is gone. That is what a rewrite quietly does.
          open(p, "w", encoding="utf-8").write(t.replace(old, "HELEKET_ENV_PROBABLY_FINE"))
          PY
          if (cd /tmp/credtest && python3 test/validate.py); then
            echo "the validator accepted a credential boundary that cannot refuse a live key in a test run"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a test credential declared live must be refusable)
        run: |
          set -eu
          # SD-02 / M-06 direction 2, and the one people skip. A production key on a dev
          # machine is the loud failure; a sandbox key in production is the quiet one —
          # invoices settle to a merchant nobody reconciles and nothing errors until the
          # revenue is missing. Half a boundary passes every test written for the other
          # half, which is why both directions are planted separately.
          rm -rf /tmp/credlive && cp -R . /tmp/credlive
          python3 - <<'PY'
          p = "/tmp/credlive/plugins/sheleg-dev/skills/crypto-payments/references/heleket-provider.md"
          t = open(p, encoding="utf-8").read()
          old = "HELEKET_ENV_LIVE_HOLDS_TEST_CREDENTIAL"
          assert old in t, "PLANT DID NOT LAND: the document no longer names " + old
          open(p, "w", encoding="utf-8").write(t.replace(old, "HELEKET_ENV_PROBABLY_FINE"))
          PY
          if (cd /tmp/credlive && python3 test/validate.py); then
            echo "the validator accepted a boundary that refuses only one direction"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (handing over a credential with no declared environment must fail)
        run: |
          set -eu
          # The measured defect itself, restored verbatim: `heleket-provider.md:1146` set
          # HELEKET_API_KEY in a copyable block with no environment beside it, while the
          # next paragraph told the reader to flip a merchant-account toggle. A dev run
          # held the production credential and the document never said so.
          rm -rf /tmp/credenv && cp -R . /tmp/credenv
          python3 - <<'PY'
          import re
          p = "/tmp/credenv/plugins/sheleg-dev/skills/crypto-payments/references/heleket-provider.md"
          t = open(p, encoding="utf-8").read()
          # drop the declaration out of the Option B block only, leaving the key
          old = "HELEKET_ENV=test\n"
          assert old in t, "PLANT DID NOT LAND: no `HELEKET_ENV=test` assignment in a fenced block"
          t2 = t.replace(old, "", 1)
          assert t2 != t, "PLANT DID NOT LAND"
          open(p, "w", encoding="utf-8").write(t2)
          PY
          if (cd /tmp/credenv && python3 test/validate.py); then
            echo "the validator accepted a block handing over a live credential with no declared environment"
            exit 1
          fi
          echo "rejected, as it must be"

      # ---- SD-03 / M-30: the manual gate. Eight plants, five against the validator that
      # requires the gate to exist in a working shape, three against the gate's own
      # decision module. The second group is the one that matters most: a guard whose
      # fixtures pass after its discriminator is removed is a guard nobody has watched.

      - name: Negative self-test (a gate that reports instead of preventing must fail)
        run: |
          set -eu
          # manifesto.md:200 — "a precondition is stronger than a warning." Moved to
          # PostToolUse this hook is a report about a refund that already cleared, which is
          # the whole defect SD-03 closed.
          rm -rf /tmp/gate-post && cp -R . /tmp/gate-post
          python3 - <<'PY'
          p = "/tmp/gate-post/plugins/sheleg-dev/hooks/hooks.json"
          t = open(p, encoding="utf-8").read()
          old = '"PreToolUse"'
          assert old in t, "PLANT DID NOT LAND: hooks.json no longer declares PreToolUse"
          open(p, "w", encoding="utf-8").write(t.replace(old, '"PostToolUse"', 1))
          PY
          if (cd /tmp/gate-post && python3 test/validate.py); then
            echo "the validator accepted a gate that can only report after the money moved"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (an `if` filter on the gate must fail)
        run: |
          set -eu
          # The Claude Code reference calls a hook entry's `if` best-effort and says it FAILS
          # OPEN on a command it cannot parse. `Bash(stripe refunds*)` is also exactly the
          # shape a `bash -c '…'` wrapper defeats, so the filter is a documented bypass
          # dressed as a narrowing.
          rm -rf /tmp/gate-if && cp -R . /tmp/gate-if
          python3 - <<'PY'
          p = "/tmp/gate-if/plugins/sheleg-dev/hooks/hooks.json"
          t = open(p, encoding="utf-8").read()
          old = '        "matcher": "Bash",\n'
          assert old in t, "PLANT DID NOT LAND: no Bash matcher in hooks.json"
          open(p, "w", encoding="utf-8").write(
              t.replace(old, old + '        "if": "Bash(stripe refunds*)",\n', 1))
          PY
          if (cd /tmp/gate-if && python3 test/validate.py); then
            echo "the validator accepted a gate resting on a filter that fails open"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a decision inlined into the hook must fail)
        run: |
          set -eu
          # "A guard decides in a pure module; the hook only moves bytes." A verdict computed
          # inside the hook cannot be fixtured without a live session, which is how a guard
          # ends up shipped with nobody having watched it refuse anything.
          rm -rf /tmp/gate-inline && cp -R . /tmp/gate-inline
          python3 - <<'PY'
          p = "/tmp/gate-inline/plugins/sheleg-dev/hooks/money-gate.js"
          t = open(p, encoding="utf-8").read()
          old = "'moneygate.js'"
          assert old in t, "PLANT DID NOT LAND: the hook no longer requires the pure module"
          open(p, "w", encoding="utf-8").write(t.replace(old, "'inlined-decision.js'", 1))
          PY
          if (cd /tmp/gate-inline && python3 test/validate.py); then
            echo "the validator accepted a hook that decides for itself"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a hook that stops failing silent must fail)
        run: |
          set -eu
          # A guard that throws breaks every turn in every session, including sessions of
          # packs that never asked for this one. That is a worse outcome than the defect the
          # guard exists to prevent, so the exit is checked rather than trusted.
          rm -rf /tmp/gate-throw && cp -R . /tmp/gate-throw
          python3 - <<'PY'
          p = "/tmp/gate-throw/plugins/sheleg-dev/hooks/money-gate.js"
          t = open(p, encoding="utf-8").read()
          old = "process.exit(0)"
          assert old in t, "PLANT DID NOT LAND: the hook no longer exits 0"
          open(p, "w", encoding="utf-8").write(t.replace(old, "process.exitCode = 2"))
          PY
          if (cd /tmp/gate-throw && python3 test/validate.py); then
            echo "the validator accepted a hook that can break every turn in every session"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (dropping the false-positive plants must fail)
        run: |
          set -eu
          # The audit rated a guard nobody has watched failing as no evidence. The converse
          # costs the same: a guard that refuses correct input gets switched off, and this
          # repository's own commands quote `sk_live_` and hand over a `.env` heredoc. So the
          # allow-plants are required to exist, not merely encouraged.
          rm -rf /tmp/gate-oneway && cp -R . /tmp/gate-oneway
          python3 - <<'PY'
          p = "/tmp/gate-oneway/test/moneygate_test.js"
          t = open(p, encoding="utf-8").read()
          assert t.count("\nallows(") > 4, "PLANT DID NOT LAND: no allow-plants to remove"
          open(p, "w", encoding="utf-8").write(t.replace("\nallows(", "\nvoid_allows(", 20))
          PY
          if (cd /tmp/gate-oneway && python3 test/validate.py); then
            echo "the validator accepted a one-directional fixture set"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a live-key rule narrowed to the bare prefix must fail)
        run: |
          set -eu
          # The shape is the discriminator, and it is what separates a credential from a
          # document quoting one. Narrow it to the prefix and `SECURITY.md`'s own sweep for
          # `sk_live_[A-Za-z0-9]` is refused — the pack can no longer run its own check.
          # This plant went UNCAUGHT on the first pass, because every prefix fixture was
          # being saved by the reader denylist instead. Two overlapping mechanisms, neither
          # individually proven, is the shape that produced it.
          rm -rf /tmp/gate-prefix && cp -R . /tmp/gate-prefix
          python3 - <<'PY'
          p = "/tmp/gate-prefix/plugins/sheleg-dev/hooks/lib/moneygate.js"
          t = open(p, encoding="utf-8").read()
          old = "const LIVE_KEY = /\\b(sk|rk)_live_[A-Za-z0-9]{16,}/;"
          assert old in t, "PLANT DID NOT LAND: LIVE_KEY no longer reads a key-shaped body"
          open(p, "w", encoding="utf-8").write(t.replace(old, "const LIVE_KEY = /\\b(sk|rk)_live_/;", 1))
          PY
          if node /tmp/gate-prefix/test/moneygate_test.js; then
            echo "the fixtures passed while the gate refuses this repository's own live-key sweep"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a heredoc body read as an invocation must fail)
        run: |
          set -eu
          # UM-10's lesson, and B-59's before it: a guard must read what would RUN. A `.env`
          # block fed to `cat` is data — `heleket-provider.md` hands the reader exactly that
          # — while a body fed to `bash` is a script and stays readable, because stripping
          # every heredoc would be a documented bypass.
          rm -rf /tmp/gate-heredoc && cp -R . /tmp/gate-heredoc
          python3 - <<'PY'
          p = "/tmp/gate-heredoc/plugins/sheleg-dev/hooks/lib/moneygate.js"
          t = open(p, encoding="utf-8").read()
          old = "      dropping = !HEREDOC_SHELLS.has(cmd);"
          assert old in t, "PLANT DID NOT LAND: the heredoc rule changed shape"
          open(p, "w", encoding="utf-8").write(t.replace(old, "      dropping = false;", 1))
          PY
          if node /tmp/gate-heredoc/test/moneygate_test.js; then
            echo "the fixtures passed while a documented .env heredoc is refused"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a test-declaring run that can be authorised must fail)
        run: |
          set -eu
          # SD-02's rule, one layer out: "Could not prove it was safe" must never read as
          # "it was safe". A run that declares test and then refunds a real card is
          # incoherent whichever half is true, so no variable may buy its way past that —
          # and an authorisation that CAN is the quiet version of having no gate.
          rm -rf /tmp/gate-authtest && cp -R . /tmp/gate-authtest
          python3 - <<'PY'
          p = "/tmp/gate-authtest/plugins/sheleg-dev/hooks/lib/moneygate.js"
          t = open(p, encoding="utf-8").read()
          old = "  if (runEnv === 'test') return false;"
          assert old in t, "PLANT DID NOT LAND: allowedFor no longer refuses a test-declaring run"
          open(p, "w", encoding="utf-8").write(t.replace(old, "  if (runEnv === 'never') return false;", 1))
          PY
          if node /tmp/gate-authtest/test/moneygate_test.js; then
            echo "the fixtures passed while a test-declaring run can be authorised for a live refund"
            exit 1
          fi
          echo "rejected, as it must be"

      - name: Negative self-test (a reference nobody links must fail)
        run: |
          set -eu
          cp -R . /tmp/orphan-copy
          touch /tmp/orphan-copy/plugins/sheleg-dev/skills/ad-tracking/references/nobody-loads-me.md
          if python3 /tmp/orphan-copy/test/validate.py; then
            echo "ERROR: validator accepted an unreferenced reference file"
            exit 1
          else
            echo "OK: validator rejects a reference nothing loads"
          fi

      - name: Negative self-test (a dangling reference link must fail)
        run: |
          set -eu
          cp -R . /tmp/dangling-copy
          rm -f /tmp/dangling-copy/plugins/sheleg-dev/skills/google-auth/references/workload-identity.md
          if python3 /tmp/dangling-copy/test/validate.py; then
            echo "ERROR: validator passed with a linked reference missing"
            exit 1
          else
            echo "OK: validator requires linked references to resolve"
          fi

      - name: Negative self-test (stray SKILL.md must fail)
        run: |
          set -eu
          cp -R . /tmp/stray-copy
          cp /tmp/stray-copy/plugins/sheleg-dev/skills/crypto-payments/SKILL.md \
             /tmp/stray-copy/plugins/sheleg-dev/SKILL.md
          if python3 /tmp/stray-copy/test/validate.py; then
            echo "ERROR: validator passed with a stray SKILL.md outside plugins/*/skills/*/"
            exit 1
          else
            echo "OK: validator rejects a stray SKILL.md"
          fi

      - name: Negative self-test (dropping the validator from CI must fail)
        run: |
          set -eu
          cp -R . /tmp/nogate-copy
          python3 - <<'PY'
          p = "/tmp/nogate-copy/.github/workflows/validate.yml"
          s = open(p, encoding="utf-8").read()
          old = "python3 test/validate.py"
          assert old in s, "PLANT DID NOT LAND: CI no longer calls the validator by this name"
          s2 = s.replace(old, "echo skipped")
          assert s2 != s, "PLANT DID NOT LAND"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/nogate-copy/test/validate.py; then
            echo "ERROR: validator passed while CI no longer calls it"
            exit 1
          else
            echo "OK: the gate notices when it stops being a gate"
          fi

      - name: install.sh syntax check
        run: bash -n install.sh

      - name: Installers run — all six skills, fresh / rerun-skip / --force / bad arg
        run: |
          set -eu
          export HOME=/tmp/fakehome
          mkdir -p "$HOME"
          node bin/sheleg-dev.js
          for s in ad-tracking crypto-payments frontend-performance google-auth google-signin stripe-billing; do
            test -f "$HOME/.claude/skills/$s/SKILL.md" || { echo "missing $s"; exit 1; }
          done
          test -f "$HOME/.claude/skills/crypto-payments/references/heleket-provider.md"
          test -f "$HOME/.claude/skills/google-auth/references/workload-identity.md"
          test -f "$HOME/.claude/skills/stripe-billing/references/webhook-events.md"
          test "$(node bin/sheleg-dev.js | grep -c '^skip:')" = 6
          test "$(node bin/sheleg-dev.js --force | grep -c '^Installed')" = 6
          if node bin/sheleg-dev.js --wat; then
            echo "ERROR: unknown arg accepted"; exit 1
          fi
          rm -rf "$HOME/.claude"
          bash install.sh | tail -1 | grep -q 'Installed 6 skill'
          echo "OK: both installers behave"

      - name: Workflow YAML parses
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/validate.yml')); print('workflow parses OK')"

      - name: Official Claude Code conformance (plugin + marketplace, strict)
        run: |
          set -eu
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/sheleg-dev --strict
